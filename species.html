<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Species | Chiang Mai & Beyond Biodiversity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="simple-header">
    <a href="index.html" class="back-home">← Home</a >
</header>


<main class="species-page">

    <p class="small-title">SPECIES DATABASE</p >

    <h1>Species</h1>

    <p class="page-intro">
        Explore organisms recorded during biodiversity observations
        around Chiang Mai and surrounding areas.
    </p >


    <div class="species-tools">

        <input
            type="text"
            id="searchInput"
            placeholder="Search species..."
        >

        <div class="filters" id="categoryFilters">

    <button class="active" data-category="All">
        All
    </button>

    <button data-category="Birds">
        Birds
    </button>

    <button data-category="Mammals">
        Mammals
    </button>

    <button data-category="Reptiles">
        Reptiles
    </button>

    <button data-category="Amphibians">
        Amphibians
    </button>

    <button data-category="Insects">
        Insects
    </button>

    <button data-category="Arachnids">
        Arachnids
    </button>

    <button data-category="Plants">
        Plants
    </button>

    <button data-category="Other">
        Other
    </button>

</div>

<div class="type-filters" id="typeFilters"></div>

    </div>


    <section id="speciesGrid" class="species-grid"></section>

</main>


<footer>
    Chiang Mai & Beyond Biodiversity Project
</footer>


<script src="species.js"></script>

</body>
</html>
